[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skenna-backend"
version = "0.1.0"
description = "FastAPI backend for sodium monitoring app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

