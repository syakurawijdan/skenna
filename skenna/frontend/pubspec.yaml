name: skenna
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  device_preview: ^1.2.0
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.2
  http: ^1.2.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.0.0
  flutter_markdown: ^0.7.3
  logger: ^2.7.0
  camera: ^0.11.4
  google_generative_ai: ^0.4.6
  image: ^4.1.7
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/home.svg
    - assets/icons/scan.svg
    - assets/icons/receipt-search.svg
    - assets/icons/repeat-circle.svg
    - assets/icons/fluent_bot-sparkle-16-regular.svg
    - assets/icons/streamline-ultimate_seasoning-food.svg
    - assets/illustrations/
    - assets/icons/fluent_molecule-24-regular.svg
    - assets/icons/fluent_food-24-regular.svg
    - assets/icons/hugeicons_serving-food.svg
    - assets/icons/edit-2.svg 
    - assets/rules/  
    - assets/icons/hugeicons_serving-food.svg
    - assets/icons/mingcute_grid-fil.svg
    - assets/icons/repeat-circle.svg
    - assets/icons/scan.svg
    - assets/icons/video-time.svg
    - assets/icons/material-symbols_readiness-score-outline-kiri.svg
    - assets/icons/material-symbols_readiness-score-outline-kanan.svg
    - assets/icons/document-text.svg
    - assets/icons/timer.svg
    - assets/icons/logo_skenna.png
    - assets/icons/streamline-ultimate_seasoning-food-bold.svg 
    - assets/icons/mage_heart-health.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo_skenna.png"
  min_sdk_android: 21
  adaptive_icon_background: "#28437C"
  adaptive_icon_foreground: "assets/icons/logo_skenna.png"
